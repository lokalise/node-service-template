services:
  postgres:
    image: postgres:18.4
    # see https://www.postgresql.org/docs/current/non-durability.html
    command: '-c full_page_writes=off -c fsync=off -c synchronous_commit=off'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=serviceuser
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=service_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 1s # run the check every 2 seconds
      timeout: 5s  # fail the check if it takes longer than 5 seconds
      retries: 10   # require 10 consecutive failures before marking unhealthy
    volumes:
      - ./scripts/db/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

  redis:
    image: redis:7.4.5-alpine
    command: redis-server --requirepass sOmE_sEcUrE_pAsS
    ports:
      - ${DOCKER_REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a sOmE_sEcUrE_pAsS ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/redis/data:cached

  # Built-in healthcheck is defined in the fauxqs Docker image
  fauxqs:
    image: kibertoad/fauxqs:latest
    ports:
      - '4566:4566'
    environment:
      FAUXQS_INIT: /app/init.json
    volumes:
      - ./scripts/fauxqs-init.json:/app/init.json

volumes:
  redis_data:
    driver: local
