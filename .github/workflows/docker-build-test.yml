name: docker-build-test

on:
  pull_request:
    paths:
      - 'apps/service/Dockerfile'
      - '.dockerignore'
      - 'apps/service/docker-compose.yml'
      - 'apps/service/.env.docker-test'
      - 'apps/service/.env.test'
      - 'apps/service/scripts/docker-healthcheck-test.sh'
      - '.github/workflows/docker-build-test.yml'

jobs:
  docker-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Docker healthcheck test
        run: ./apps/service/scripts/docker-healthcheck-test.sh
